<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solwave | Page Not Found</title>
  <meta name="description" content="This Solwave page is not available yet. Return to the main under construction page." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.solwave.dev/" />
  <meta property="og:title" content="Solwave | Under Construction" />
  <meta property="og:description" content="Custom software, automation, and digital products. Our new website is coming soon." />
  <meta property="og:image" content="https://www.solwave.dev/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Solwave | Under Construction" />
  <meta name="twitter:description" content="Custom software, automation, and digital products. Our new website is coming soon." />
  <meta name="twitter:image" content="https://www.solwave.dev/og-image.png" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/solwave-gradient.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #050816;
      --border: rgba(255, 255, 255, 0.14);
      --text: #f8fafc;
      --muted: #a7b0c0;
      --blue: #4f63ff;
      --orange: #ff7a1a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(255, 122, 26, 0.12), transparent 32%),
        radial-gradient(circle at bottom right, rgba(79, 99, 255, 0.22), transparent 34%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      width: min(100%, 920px);
      min-height: 620px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(8, 13, 32, 0.94), rgba(3, 6, 18, 0.96));
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      padding: 64px 24px 36px;
      display: grid;
      place-items: center;
    }

    .wave-bg {
      position: absolute;
      inset: auto -10% 120px -10%;
      height: 260px;
      opacity: 0.45;
      background:
        repeating-radial-gradient(
          ellipse at center,
          rgba(79, 99, 255, 0.5) 0 1px,
          transparent 1px 12px
        );
      transform: rotate(-5deg);
      filter: blur(0.4px);
      mask-image: linear-gradient(to bottom, transparent, black 28%, black 72%, transparent);
    }

    .content {
      position: relative;
      z-index: 2;
      max-width: 680px;
      margin: 0 auto;
      text-align: center;
    }

    .logo-mark {
      position: relative;
      width: 112px;
      height: 112px;
      margin: 0 auto 24px;
    }

    .logo-mark::before,
    .logo-mark::after {
      content: "";
      position: absolute;
      inset: -12px;
      border: 1px solid rgba(79, 99, 255, 0.34);
      border-radius: 50%;
      animation: pulse-ring 3.4s ease-out infinite;
    }

    .logo-mark::after {
      inset: -24px;
      border-color: rgba(255, 122, 26, 0.24);
      animation-delay: 1.2s;
    }

    .logo {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background:
        linear-gradient(135deg, #ffb02e, #ff365f 48%, transparent 49%),
        linear-gradient(315deg, #0044a8, #061b44 55%, transparent 56%);
      box-shadow: 0 16px 40px rgba(79, 99, 255, 0.22);
      border: 3px solid rgba(255, 255, 255, 0.88);
    }

    @keyframes pulse-ring {
      0% {
        opacity: 0;
        transform: scale(0.86);
      }

      22% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: scale(1.18);
      }
    }

    .brand {
      letter-spacing: 0.42em;
      font-size: clamp(26px, 5vw, 40px);
      font-weight: 700;
      margin-bottom: 34px;
      text-indent: 0.42em;
    }

    .brand span {
      color: var(--blue);
    }

    .error-code {
      color: var(--blue);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(52px, 9vw, 92px);
      line-height: 0.95;
      margin-bottom: 22px;
    }

    .message {
      color: #d7dce8;
      font-size: clamp(17px, 2vw, 22px);
      line-height: 1.55;
      max-width: 560px;
      margin: 0 auto 34px;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin-bottom: 52px;
      padding: 0 22px;
      border-radius: 12px;
      color: white;
      font-weight: 700;
      text-decoration: none;
      background: linear-gradient(135deg, var(--blue), #6e45ff);
      box-shadow: 0 12px 30px rgba(79, 99, 255, 0.35);
    }

    .home-link:hover {
      transform: translateY(-1px);
    }

    footer {
      position: relative;
      z-index: 2;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      .page {
        min-height: 580px;
        padding: 44px 18px 72px;
      }

      .logo-mark {
        width: 96px;
        height: 96px;
      }

      .brand {
        letter-spacing: 0.28em;
        text-indent: 0.28em;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="wave-bg" aria-hidden="true"></div>

    <section class="content">
      <div class="logo-mark">
        <div class="logo" role="img" aria-label="Solwave logo"></div>
      </div>
      <div class="brand">SOL<span>WAVE</span></div>

      <p class="error-code">404</p>
      <h1>Page not found</h1>
      <p class="message">
        This page is not available yet. Our new website is still under construction,
        but the main page is ready to welcome you back.
      </p>
      <a class="home-link" href="/">Return home</a>
    </section>

    <footer>
      <p>&copy; 2026 Solwave. All rights reserved.</p>
    </footer>
  </main>
</body>
</html>
